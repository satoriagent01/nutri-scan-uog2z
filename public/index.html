<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriScan - Rastreador Nutricional</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: white;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    header {
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 1.5rem;
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.85rem;
      opacity: 0.9;
    }

    nav {
      display: flex;
      background: #388E3C;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav button {
      flex: 1;
      padding: 12px 8px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      border-bottom: 3px solid transparent;
    }

    nav button.active {
      color: white;
      border-bottom-color: #FFD700;
      background: rgba(255,255,255,0.1);
    }

    nav button:hover {
      background: rgba(255,255,255,0.1);
    }

    .content {
      padding: 16px;
      padding-bottom: 80px;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid #eee;
    }

    .card h3 {
      color: #2E7D32;
      margin-bottom: 8px;
      font-size: 1rem;
    }

    .card p {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 4px;
    }

    .nutrition-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .nutrition-item {
      background: #f8f9fa;
      padding: 8px;
      border-radius: 8px;
      text-align: center;
    }

    .nutrition-item .value {
      font-size: 1.1rem;
      font-weight: bold;
      color: #2E7D32;
    }

    .nutrition-item .label {
      font-size: 0.75rem;
      color: #888;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
      text-align: center;
    }

    .btn:hover {
      background: #43A047;
    }

    .btn-secondary {
      background: #757575;
    }

    .btn-secondary:hover {
      background: #616161;
    }

    .btn-danger {
      background: #e53935;
    }

    .btn-danger:hover {
      background: #d32f2f;
    }

    .btn-small {
      padding: 8px 16px;
      font-size: 0.85rem;
      width: auto;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 12px;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #4CAF50;
      box-shadow: 0 0 0 2px rgba(76,175,80,0.2);
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 0.85rem;
      color: #555;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .upload-area {
      border: 2px dashed #4CAF50;
      border-radius: 12px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #f8f9fa;
    }

    .upload-area:hover {
      background: #e8f5e9;
    }

    .upload-area .icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .upload-area p {
      color: #666;
      font-size: 0.9rem;
    }

    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    .product-item:last-child {
      border-bottom: none;
    }

    .product-info h4 {
      font-size: 0.95rem;
      color: #333;
    }

    .product-info p {
      font-size: 0.8rem;
      color: #888;
    }

    .delete-btn {
      background: #ffebee;
      color: #e53935;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .delete-btn:hover {
      background: #ffcdd2;
    }

    .meal-item {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    .meal-item:last-child {
      border-bottom: none;
    }

    .meal-item h4 {
      font-size: 0.95rem;
      color: #333;
    }

    .meal-item .date {
      font-size: 0.8rem;
      color: #888;
    }

    .meal-item .nutrition-summary {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      font-size: 0.8rem;
      color: #666;
    }

    .week-day {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    .week-day .day-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .week-day .day-header .date {
      font-weight: 600;
      color: #333;
    }

    .week-day .day-header .kcal {
      color: #4CAF50;
      font-weight: 600;
    }

    .week-day.empty {
      opacity: 0.5;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal {
      background: white;
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal h3 {
      margin-bottom: 16px;
      color: #2E7D32;
    }

    .modal .close-btn {
      float: right;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #999;
    }

    .modal .close-btn:hover {
      color: #333;
    }

    .product-select {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .product-select select {
      flex: 1;
      margin-bottom: 0;
    }

    .product-select input {
      flex: 0.5;
      margin-bottom: 0;
    }

    .remove-item {
      background: #ffebee;
      color: #e53935;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .loading .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #4CAF50;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }

    .alert-info {
      background: #e3f2fd;
      color: #1565c0;
      border: 1px solid #90caf9;
    }

    .alert-success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }

    .alert-error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }

    .config-section {
      background: #f8f9fa;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .config-section h4 {
      margin-bottom: 12px;
      color: #333;
    }

    .image-preview {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .extracted-data {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
    }

    .extracted-data h4 {
      margin-bottom: 8px;
      color: #2E7D32;
    }

    .extracted-data .field {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #eee;
    }

    .extracted-data .field:last-child {
      border-bottom: none;
    }

    .extracted-data .field .key {
      color: #666;
    }

    .extracted-data .field .value {
      font-weight: 500;
      color: #333;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React from 'https://esm.sh/react@18';
    import ReactDOM from 'https://esm.sh/react-dom@18/client';

    import { setAIConfig, getAIConfig } from './src/config.js';
    import { addProduct, getProducts, deleteProduct } from './src/products.js';
    import { createMeal, getMeals, calculateMealNutrition } from './src/meals.js';
    import { getDailyTotal, getWeeklyOverview } from './src/tracking.js';
    import { extractNutrition } from './src/ocr.js';

    // App State
    function App() {
      const [activeTab, setActiveTab] = React.useState('scan');
      const [products, setProducts] = React.useState([]);
      const [meals, setMeals] = React.useState([]);
      const [config, setConfig] = React.useState(getAIConfig());
      const [loading, setLoading] = React.useState(false);
      const [error, setError] = React.useState(null);
      const [success, setSuccess] = React.useState(null);

      React.useEffect(() => {
        setProducts(getProducts());
        const today = new Date().toISOString().split('T')[0];
        setMeals(getMeals(today));
      }, []);

      const refreshProducts = () => setProducts(getProducts());
      const refreshMeals = (date) => setMeals(getMeals(date));

      return React.createElement('div', { className: 'app' },
        React.createElement('header', null,
          React.createElement('h1', null, '🥗 NutriScan'),
          React.createElement('p', null, 'Escanea, planifica, controla')
        ),
        React.createElement('nav', null,
          React.createElement('button', {
            className: activeTab === 'scan' ? 'active' : '',
            onClick: () => setActiveTab('scan')
          }, '📸 Escanear'),
          React.createElement('button', {
            className: activeTab === 'products' ? 'active' : '',
            onClick: () => setActiveTab('products')
          }, '📦 Productos'),
          React.createElement('button', {
            className: activeTab === 'meals' ? 'active' : '',
            onClick: () => setActiveTab('meals')
          }, '🍽️ Comidas'),
          React.createElement('button', {
            className: activeTab === 'tracking' ? 'active' : '',
            onClick: () => setActiveTab('tracking')
          }, '📊 Seguimiento'),
          React.createElement('button', {
            className: activeTab === 'config' ? 'active' : '',
            onClick: () => setActiveTab('config')
          }, '⚙️')
        ),
        React.createElement('div', { className: 'content' },
          error ? React.createElement('div', { className: 'alert alert-error', onClick: () => setError(null) }, error) : null,
          success ? React.createElement('div', { className: 'alert alert-success', onClick: () => setSuccess(null) }, success) : null,
          activeTab === 'scan' ? React.createElement(ScanSection, {
            loading, setLoading, setError, setSuccess, refreshProducts
          }) : null,
          activeTab === 'products' ? React.createElement(ProductsSection, {
            products, refreshProducts, setError, setSuccess
          }) : null,
          activeTab === 'meals' ? React.createElement(MealsSection, {
            products, meals, refreshMeals, setError, setSuccess
          }) : null,
          activeTab === 'tracking' ? React.createElement(TrackingSection, {
            setError
          }) : null,
          activeTab === 'config' ? React.createElement(ConfigSection, {
            config, setConfig, setError, setSuccess
          }) : null
        )
      );
    }

    // Scan Section
    function ScanSection({ loading, setLoading, setError, setSuccess, refreshProducts }) {
      const [imagePreview, setImagePreview] = React.useState(null);
      const [extractedData, setExtractedData] = React.useState(null);
      const [showForm, setShowForm] = React.useState(false);
      const fileInputRef = React.useRef(null);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          setImagePreview(event.target.result);
          setExtractedData(null);
        };
        reader.readAsDataURL(file);
      };

      const handleScan = async () => {
        if (!imagePreview) {
          setError('Por favor, selecciona una imagen primero.');
          return;
        }

        setLoading(true);
        setError(null);
        setSuccess(null);

        try {
          // Extract base64 data (remove data:image/...;base64, prefix)
          const base64Data = imagePreview.split(',')[1];
          const result = await extractNutrition(base64Data);
          setExtractedData(result);
          setShowForm(true);
        } catch (err) {
          setError('Error al escanear: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleSaveProduct = () => {
        if (!extractedData) return;

        const product = {
          id: 'prod-' + Date.now(),
          name: extractedData.name || 'Producto escaneado',
          brand: extractedData.brand || '',
          servingSize: extractedData.servingSize || '100g',
          nutritionPer100g: extractedData.nutritionPer100g || {
            energyKj: 0,
            energyKcal: 0,
            fat: 0,
            saturatedFat: 0,
            carbohydrates: 0,
            sugars: 0,
            fiber: 0,
            protein: 0,
            salt: 0
          }
        };

        addProduct(product);
        refreshProducts();
        setSuccess('Producto guardado correctamente.');
        setShowForm(false);
        setImagePreview(null);
        setExtractedData(null);
      };

      return React.createElement('div', { className: 'section active' },
        React.createElement('h2', { style: { marginBottom: '16px', fontSize: '1.2rem' } }, 'Escanear Etiqueta'),
        React.createElement('div', {
          className: 'upload-area',
          onClick: () => fileInputRef.current && fileInputRef.current.click()
        },
          React.createElement('input', {
            type: 'file',
            accept: 'image/*',
            capture: 'environment',
            ref: fileInputRef,
            onChange: handleImageUpload,
            style: { display: 'none' }
          }),
          React.createElement('div', { className: 'icon' }, '📷'),
          React.createElement('p', null, 'Toca para tomar una foto o seleccionar una imagen'),
          React.createElement('p', { style: { fontSize: '0.8rem', color: '#999', marginTop: '4px' } }, 'Fotografía la tabla nutricional del producto')
        ),
        imagePreview ? React.createElement('div', { style: { marginTop: '16px' } },
          React.createElement('img', { src: imagePreview, className: 'image-preview', alt: 'Preview' }),
          React.createElement('button', { className: 'btn', onClick: handleScan, disabled: loading },
            loading ? 'Escaneando...' : '🔍 Extraer Datos'
          )
        ) : null,
        loading ? React.createElement('div', { className: 'loading' },
          React.createElement('div', { className: 'spinner' }),
          React.createElement('p', null, 'Procesando imagen con IA...')
        ) : null,
        extractedData ? React.createElement('div', { className: 'card' },
          React.createElement('h3', null, 'Datos Extraídos'),
          React.createElement('div', { className: 'extracted-data' },
            React.createElement('div', { className: 'field' },
              React.createElement('span', { className: 'key' }, 'Nombre'),
              React.createElement('span', { className: 'value' }, extractedData.name)
            ),
            React.createElement('div', { className: 'field' },
              React.createElement('span', { className: 'key' }, 'Marca'),
              React.createElement('span', { className: 'value' }, extractedData.brand)
            ),
            React.createElement('div', { className: 'field' },
              React.createElement('span', { className: 'key' }, 'Porción'),
              React.createElement('span', { className: 'value' }, extractedData.servingSize)
            ),
            React.createElement('h4', { style: { marginTop: '12px', marginBottom: '8px' } }, 'Nutrición por 100g'),
            Object.entries(extractedData.nutritionPer100g || {}).map(([key, value]) =>
              React.createElement('div', { className: 'field', key: key },
                React.createElement('span', { className: 'key' }, key),
                React.createElement('span', { className: 'value' }, value)
              )
            )
          ),
          React.createElement('button', { className: 'btn', style: { marginTop: '12px' }, onClick: handleSaveProduct },
            '💾 Guardar Producto'
          )
        ) : null
      );
    }

    // Products Section
    function ProductsSection({ products, refreshProducts, setError, setSuccess }) {
      const [showForm, setShowForm] = React.useState(false);
      const [formData, setFormData] = React.useState({
        name: '',
        brand: '',
        servingSize: '100g',
        energyKj: '',
        energyKcal: '',
        fat: '',
        saturatedFat: '',
        carbohydrates: '',
        sugars: '',
        fiber: '',
        protein: '',
        salt: ''
      });

      const handleDelete = (id) => {
        deleteProduct(id);
        refreshProducts();
        setSuccess('Producto eliminado.');
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const product = {
          id: 'prod-' + Date.now(),
          name: formData.name,
          brand: formData.brand,
          servingSize: formData.servingSize,
          nutritionPer100g: {
            energyKj: Number(formData.energyKj) || 0,
            energyKcal: Number(formData.energyKcal) || 0,
            fat: Number(formData.fat) || 0,
            saturatedFat: Number(formData.saturatedFat) || 0,
            carbohydrates: Number(formData.carbohydrates) || 0,
            sugars: Number(formData.sugars) || 0,
            fiber: Number(formData.fiber) || 0,
            protein: Number(formData.protein) || 0,
            salt: Number(formData.salt) || 0
          }
        };

        addProduct(product);
        refreshProducts();
        setSuccess('Producto agregado.');
        setShowForm(false);
        setFormData({
          name: '', brand: '', servingSize: '100g',
          energyKj: '', energyKcal: '', fat: '', saturatedFat: '',
          carbohydrates: '', sugars: '', fiber: '', protein: '', salt: ''
        });
      };

      return React.createElement('div', { className: 'section active' },
        React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' } },
          React.createElement('h2', { style: { fontSize: '1.2rem' } }, 'Mis Productos'),
          React.createElement('button', {
            className: 'btn btn-small',
            onClick: () => setShowForm(!showForm)
          }, showForm ? 'Cancelar' : '+ Agregar')
        ),
        showForm ? React.createElement('div', { className: 'card' },
          React.createElement('form', { onSubmit: handleSubmit },
            React.createElement('div', { className: 'form-group' },
              React.createElement('label', null, 'Nombre del producto'),
              React.createElement('input', {
                type: 'text',
                value: formData.name,
                onChange: (e) => setFormData({ ...formData, name: e.target.value }),
                required: true
              })
            ),
            React.createElement('div', { className: 'form-group' },
              React.createElement('label', null, 'Marca'),
              React.createElement('input', {
                type: 'text',
                value: formData.brand,
                onChange: (e) => setFormData({ ...formData, brand: e.target.value })
              })
            ),
            React.createElement('div', { className: 'form-group' },
              React.createElement('label', null, 'Tamaño de porción'),
              React.createElement('input', {
                type: 'text',
                value: formData.servingSize,
                onChange: (e) => setFormData({ ...formData, servingSize: e.target.value })
              })
            ),
            React.createElement('h4', { style: { marginBottom: '8px' } }, 'Nutrición por 100g'),
            React.createElement('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
              React.createElement('div', { className: 'form-group' },
                React.createElement('label', null, 'Energía (kJ)'),
                React.createElement('input', {
                  type: 'number',
                  value: formData.energyKj,
                  onChange: (e) => setFormData({ ...formData, energyKj: e.target.value })
                })
              ),
              React.createElement('div', { className: 'form-group' },
                React.createElement('label', null, 'Energía (kcal)'),
                React.createElement('input', {
                  type: 'number',
                  value: formData.energyKcal,
                  onChange: (e) => setFormData({ ...formData, energyKcal: e.target.value })
                })
              ),
              React.createElement('div', { className: 'form-group' },
                React.createElement('label', null, 'Grasa (g)'),
                React.createElement('input', {
                  type: 'number',
                  value: formData.fat,
                  onChange: (e) => setFormData({ ...formData, fat: e.target.value })
                })
              ),
              React.createElement('div', { className: 'form-group' },
                React.createElement('label', null, 'Grasa saturada (g)'),
                React.createElement('input', {
                  type: 'number',
                  value: formData.saturatedFat,
                  onChange: (e) => setFormData({ ...formData, saturatedFat: e.target.value })
                })
              ),
              React.createElement('div', { className: 'form-group' },
                React.createElement('label', null, 'Carbohidratos (g)'),
                React.createElement('input', {
                  type: 'number',
                  value: formData.carbohydrates,
                  onChange: (e) => setFormData({ ...formData, carbohydrates: e.target.value })
                })
              ),
              React.createElement('div', { className: 'form-group' },
                React.createElement('label', null, 'Azúcares (g)'),
                React.createElement('input', {
                  type: 'number',
                  value: formData.sugars,
                  onChange: (e) => setFormData({ ...formData, sugars: e.target.value })
                })
              ),
              React.createElement('div', { className: 'form-group' },
                React.createElement('label', null, 'Fibra (g)'),
                React.createElement('input', {
                  type: 'number',
                  value: formData.fiber,
                  onChange: (e) => setFormData({ ...formData, fiber: e.target.value })
                })
              ),
              React.createElement('div', { className: 'form-group' },
                React.createElement('label', null, 'Proteína (g)'),
                React.createElement('input', {
                  type: 'number',
                  value: formData.protein,
                  onChange: (e) => setFormData({ ...formData, protein: e.target.value })
                })
              ),
              React.createElement('div', { className: 'form-group' },
                React.createElement('label', null, 'Sal (g)'),
                React.createElement('input', {
                  type: 'number',
                  value: formData.salt,
                  onChange: (e) => setFormData({ ...formData, salt: e.target.value })
                })
              )
            ),
            React.createElement('button', { type: 'submit', className: 'btn' }, 'Guardar Producto')
          )
        ) : null,
        products.length === 0 ? React.createElement('div', { className: 'empty-state' },
          React.createElement('div', { className: 'icon' }, '📦'),
          React.createElement('p', null, 'No hay productos guardados'),
          React.createElement('p', { style: { fontSize: '0.85rem' } }, 'Escanea una etiqueta o agrega uno manualmente')
        ) : React.createElement('div', null,
          products.map(product =>
            React.createElement('div', { className: 'card', key: product.id },
              React.createElement('div', { className: 'product-item', style: { borderBottom: 'none', padding: 0 } },
                React.createElement('div', { className: 'product-info' },
                  React.createElement('h4', null, product.name),
                  React.createElement('p', null, product.brand || 'Sin marca'),
                  React.createElement('p', null, 'Porción: ' + product.servingSize)
                ),
                React.createElement('button', {
                  className: 'delete-btn',
                  onClick: () => handleDelete(product.id)
                }, '🗑️')
              ),
              React.createElement('div', { className: 'nutrition-grid' },
                React.createElement('div', { className: 'nutrition-item' },
                  React.createElement('div', { className: 'value' }, product.nutritionPer100g.energyKcal),
                  React.createElement('div', { className: 'label' }, 'kcal')
                ),
                React.createElement('div', { className: 'nutrition-item' },
                  React.createElement('div', { className: 'value' }, product.nutritionPer100g.fat),
                  React.createElement('div', { className: 'label' }, 'Grasa g')
                ),
                React.createElement('div', { className: 'nutrition-item' },
                  React.createElement('div', { className: 'value' }, product.nutritionPer100g.carbohydrates),
                  React.createElement('div', { className: 'label' }, 'Carbs g')
                ),
                React.createElement('div', { className: 'nutrition-item' },
                  React.createElement('div', { className: 'value' }, product.nutritionPer100g.protein),
                  React.createElement('div', { className: 'label' }, 'Proteína g')
                )
              )
            )
          )
        )
      );
    }

    // Meals Section
    function MealsSection({ products, meals, refreshMeals, setError, setSuccess }) {
      const [showForm, setShowForm] = React.useState(false);
      const [selectedDate, setSelectedDate] = React.useState(new Date().toISOString().split('T')[0]);
      const [mealItems, setMealItems] = React.useState([
        { productId: '', productName: '', grams: '' }
      ]);
      const [mealName, setMealName] = React.useState('');

      const handleAddItem = () => {
        setMealItems([...mealItems, { productId: '', productName: '', grams: '' }]);
      };

      const handleRemoveItem = (index) => {
        setMealItems(mealItems.filter((_, i) => i !== index));
      };

      const handleProductChange = (index, productId) => {
        const product = products.find(p => p.id === productId);
        const newItems = [...mealItems];
        if (product) {
          newItems[index].productId = productId;
          newItems[index].productName = product.name;
        }
        setMealItems(newItems);
      };

      const handleGramsChange = (index, grams) => {
        const newItems = [...mealItems];
        newItems[index].grams = grams;
        setMealItems(newItems);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!mealName.trim()) {
          setError('Por favor, ingresa un nombre para la comida.');
          return;
        }

        const validItems = mealItems.filter(item => item.productId && item.grams);
        if (validItems.length === 0) {
          setError('Agrega al menos un producto con cantidad.');
          return;
        }

        const meal = {
          id: 'meal-' + Date.now(),
          name: mealName,
          date: selectedDate,
          items: validItems.map(item => ({
            productId: item.productId,
            productName: item.productName,
            grams: Number(item.grams)
          }))
        };

        createMeal(meal);
        refreshMeals(selectedDate);
        setSuccess('Comida guardada.');
        setShowForm(false);
        setMealName('');
        setMealItems([{ productId: '', productName: '', grams: '' }]);
      };

      const todayMeals = getMeals(selectedDate);

      return React.createElement('div', { className: 'section active' },
        React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' } },
          React.createElement('h2', { style: { fontSize: '1.2rem' } }, 'Comidas'),
          React.createElement('button', {
            className: 'btn btn-small',
            onClick: () => setShowForm(!showForm)
          }, showForm ? 'Cancelar' : '+ Nueva')
        ),
        React.createElement('div', { className: 'form-group' },
          React.createElement('label', null, 'Seleccionar fecha'),
          React.createElement('input', {
            type: 'date',
            value: selectedDate,
            onChange: (e) => setSelectedDate(e.target.value)
          })
        ),
        showForm ? React.createElement('div', { className: 'card' },
          React.createElement('form', { onSubmit: handleSubmit },
            React.createElement('div', { className: 'form-group' },
              React.createElement('label', null, 'Nombre de la comida'),
              React.createElement('input', {
                type: 'text',
                value: mealName,
                onChange: (e) => setMealName(e.target.value),
                required: true,
                placeholder: 'Ej: Almuerzo'
              })
            ),
            mealItems.map((item, index) =>
              React.createElement('div', { key: index, style: { marginBottom: '12px' } },
                React.createElement('div', { className: 'product-select' },
                  React.createElement('select', {
                    value: item.productId,
                    onChange: (e) => handleProductChange(index, e.target.value)
                  },
                    React.createElement('option', { value: '' }, 'Seleccionar producto'),
                    products.map(p =>
                      React.createElement('option', { key: p.id, value: p.id }, p.name)
                    )
                  ),
                  React.createElement('input', {
                    type: 'number',
                    placeholder: 'Gramos',
                    value: item.grams,
                    onChange: (e) => handleGramsChange(index, e.target.value),
                    min: '0'
                  }),
                  mealItems.length > 1 ? React.createElement('button', {
                    type: 'button',
                    className: 'remove-item',
                    onClick: () => handleRemoveItem(index)
                  }, '×') : null
                )
              )
            ),
            React.createElement('button', {
              type: 'button',
              className: 'btn btn-secondary',
              style: { marginBottom: '12px' },
              onClick: handleAddItem
            }, '+ Agregar producto'),
            React.createElement('button', { type: 'submit', className: 'btn' }, 'Guardar Comida')
          )
        ) : null,
        todayMeals.length === 0 ? React.createElement('div', { className: 'empty-state' },
          React.createElement('div', { className: 'icon' }, '🍽️'),
          React.createElement('p', null, 'No hay comidas para esta fecha'),
          React.createElement('p', { style: { fontSize: '0.85rem' } }, 'Crea una nueva comida para comenzar')
        ) : React.createElement('div', null,
          todayMeals.map(meal => {
            const nutrition = calculateMealNutrition(meal);
            return React.createElement('div', { className: 'card', key: meal.id },
              React.createElement('h3', null, meal.name),
              React.createElement('p', { style: { fontSize: '0.8rem', color: '#888' } },
                meal.items.map(item => `${item.productName} (${item.grams}g)`).join(', ')
              ),
              React.createElement('div', { className: 'nutrition-grid' },
                React.createElement('div', { className: 'nutrition-item' },
                  React.createElement('div', { className: 'value' }, Math.round(nutrition.energyKcal)),
                  React.createElement('div', { className: 'label' }, 'kcal')
                ),
                React.createElement('div', { className: 'nutrition-item' },
                  React.createElement('div', { className: 'value' }, Math.round(nutrition.fat * 10) / 10),
                  React.createElement('div', { className: 'label' }, 'Grasa g')
                ),
                React.createElement('div', { className: 'nutrition-item' },
                  React.createElement('div', { className: 'value' }, Math.round(nutrition.carbohydrates * 10) / 10),
                  React.createElement('div', { className: 'label' }, 'Carbs g')
                ),
                React.createElement('div', { className: 'nutrition-item' },
                  React.createElement('div', { className: 'value' }, Math.round(nutrition.protein * 10) / 10),
                  React.createElement('div', { className: 'label' }, 'Proteína g')
                )
              )
            );
          })
        )
      );
    }

    // Tracking Section
    function TrackingSection({ setError }) {
      const [selectedDate, setSelectedDate] = React.useState(new Date().toISOString().split('T')[0]);
      const [view, setView] = React.useState('daily'); // 'daily' or 'weekly'

      const dailyTotal = getDailyTotal(selectedDate);
      const weeklyData = getWeeklyOverview(selectedDate);

      return React.createElement('div', { className: 'section active' },
        React.createElement('h2', { style: { marginBottom: '16px', fontSize: '1.2rem' } }, 'Seguimiento Nutricional'),
        React.createElement('div', { style: { display: 'flex', gap: '8px', marginBottom: '16px' } },
          React.createElement('button', {
            className: 'btn btn-small ' + (view === 'daily' ? '' : 'btn-secondary'),
            onClick: () => setView('daily')
          }, 'Diario'),
          React.createElement('button', {
            className: 'btn btn-small ' + (view === 'weekly' ? '' : 'btn-secondary'),
            onClick: () => setView('weekly')
          }, 'Semanal')
        ),
        view === 'daily' ? React.createElement('div', null,
          React.createElement('div', { className: 'form-group' },
            React.createElement('label', null, 'Seleccionar fecha'),
            React.createElement('input', {
              type: 'date',
              value: selectedDate,
              onChange: (e) => setSelectedDate(e.target.value)
            })
          ),
          React.createElement('div', { className: 'card' },
            React.createElement('h3', null, 'Total del día - ' + selectedDate),
            React.createElement('div', { className: 'nutrition-grid' },
              React.createElement('div', { className: 'nutrition-item' },
                React.createElement('div', { className: 'value' }, Math.round(dailyTotal.energyKcal)),
                React.createElement('div', { className: 'label' }, 'kcal')
              ),
              React.createElement('div', { className: 'nutrition-item' },
                React.createElement('div', { className: 'value' }, Math.round(dailyTotal.fat * 10) / 10),
                React.createElement('div', { className: 'label' }, 'Grasa g')
              ),
              React.createElement('div', { className: 'nutrition-item' },
                React.createElement('div', { className: 'value' }, Math.round(dailyTotal.saturatedFat * 10) / 10),
                React.createElement('div', { className: 'label' }, 'Grasa sat. g')
              ),
              React.createElement('div', { className: 'nutrition-item' },
                React.createElement('div', { className: 'value' }, Math.round(dailyTotal.carbohydrates * 10) / 10),
                React.createElement('div', { className: 'label' }, 'Carbs g')
              ),
              React.createElement('div', { className: 'nutrition-item' },
                React.createElement('div', { className: 'value' }, Math.round(dailyTotal.sugars * 10) / 10),
                React.createElement('div', { className: 'label' }, 'Azúcares g')
              ),
              React.createElement('div', { className: 'nutrition-item' },
                React.createElement('div', { className: 'value' }, Math.round(dailyTotal.fiber * 10) / 10),
                React.createElement('div', { className: 'label' }, 'Fibra g')
              ),
              React.createElement('div', { className: 'nutrition-item' },
                React.createElement('div', { className: 'value' }, Math.round(dailyTotal.protein * 10) / 10),
                React.createElement('div', { className: 'label' }, 'Proteína g')
              ),
              React.createElement('div', { className: 'nutrition-item' },
                React.createElement('div', { className: 'value' }, Math.round(dailyTotal.salt * 100) / 100),
                React.createElement('div', { className: 'label' }, 'Sal g')
              )
            )
          )
        ) : React.createElement('div', null,
          React.createElement('div', { className: 'form-group' },
            React.createElement('label', null, 'Semana desde'),
            React.createElement('input', {
              type: 'date',
              value: selectedDate,
              onChange: (e) => setSelectedDate(e.target.value)
            })
          ),
          React.createElement('div', { className: 'card' },
            React.createElement('h3', null, 'Resumen Semanal'),
            weeklyData.map(day =>
              React.createElement('div', {
                className: 'week-day ' + (day.energyKcal === 0 ? 'empty' : ''),
                key: day.date
              },
                React.createElement('div', { className: 'day-header' },
                  React.createElement('span', { className: 'date' }, day.date),
                  React.createElement('span', { className: 'kcal' }, Math.round(day.energyKcal) + ' kcal')
                ),
                React.createElement('div', { style: { display: 'flex', gap: '8px', fontSize: '0.75rem', color: '#888' } },
                  React.createElement('span', null, 'P: ' + Math.round(day.protein * 10) / 10 + 'g'),
                  React.createElement('span', null, 'F: ' + Math.round(day.fat * 10) / 10 + 'g'),
                  React.createElement('span', null, 'C: ' + Math.round(day.carbohydrates * 10) / 10 + 'g')
                )
              )
            )
          )
        )
      );
    }

    // Config Section
    function ConfigSection({ config, setConfig, setError, setSuccess }) {
      const [url, setUrl] = React.useState(config.url);
      const [apiKey, setApiKey] = React.useState(config.apiKey);

      const handleSave = () => {
        setAIConfig(url, apiKey);
        setConfig(getAIConfig());
        setSuccess('Configuración guardada.');
      };

      return React.createElement('div', { className: 'section active' },
        React.createElement('h2', { style: { marginBottom: '16px', fontSize: '1.2rem' } }, 'Configuración'),
        React.createElement('div', { className: 'config-section' },
          React.createElement('h4', null, 'Endpoint de IA'),
          React.createElement('p', { style: { fontSize: '0.85rem', color: '#666', marginBottom: '12px' } },
            'Configura tu endpoint OpenAI-compatible para el OCR de etiquetas nutricionales.'
          ),
          React.createElement('div', { className: 'form-group' },
            React.createElement('label', null, 'URL del endpoint'),
            React.createElement('input', {
              type: 'text',
              value: url,
              onChange: (e) => setUrl(e.target.value),
              placeholder: 'https://api.openai.com/v1'
            })
          ),
          React.createElement('div', { className: 'form-group' },
            React.createElement('label', null, 'API Key'),
            React.createElement('input', {
              type: 'password',
              value: apiKey,
              onChange: (e) => setApiKey(e.target.value),
              placeholder: 'sk-...'
            })
          ),
          React.createElement('button', { className: 'btn', onClick: handleSave }, 'Guardar Configuración')
        ),
        React.createElement('div', { className: 'config-section' },
          React.createElement('h4', null, 'Información'),
          React.createElement('p', { style: { fontSize: '0.85rem', color: '#666' } },
            'NutriScan utiliza IA para extraer datos nutricionales de fotos de etiquetas. ' +
            'Necesitas una cuenta con un servicio compatible con OpenAI (como OpenAI, Azure, o cualquier API compatible).'
          )
        )
      );
    }

    // Render the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
